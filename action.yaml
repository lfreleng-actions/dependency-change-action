# dependency-change-action
name: "🔎 Dependency Change Detection"
description: >-
  Reports whether a Gerrit change or GitHub pull request touched the
  files that declare or lock its dependencies, as a sidecar that
  grype-scan-action reads to decide whether findings gate or warn.
  Fails closed: when the answer cannot be proven, no sidecar is written.

inputs:
  ecosystems:
    description: >-
      Comma-separated presets: node, python, go, maven, gradle, rust,
      docker. An unknown name fails the step. Required unless patterns
      is set.
    required: false
    default: ""
  patterns:
    description: >-
      Extra patterns, one per line, added to the presets. A name matches
      a file name, a path containing '/' matches relative to the
      directory it is anchored at, a trailing '/' matches everything
      beneath a directory, and '*' matches within one path segment.
    required: false
    default: ""
  path-prefix:
    description: >-
      Project directory, relative to the checkout. Patterns match at any
      depth inside it, and above it only when anchored at an ancestor.
    required: false
    default: "."
  gerrit-refspec:
    description: >-
      Set on Gerrit-triggered runs; the checkout is then the change
      itself and its parent, HEAD^1, is the base.
    required: false
    default: ""
  base:
    description: >-
      Explicit base commit, overriding event detection. The result is
      unresolved when it does not name a commit in the checkout.
    required: false
    default: ""
  output:
    description: >-
      Sidecar path, written only when the result is resolved. Any file
      already there is removed first.
    required: false
    default: "dependency-change.json"

outputs:
  changed:
    description: >-
      'true', 'false', or empty when unresolved; feeds
      grype-scan-action's dependencies-changed input directly.
    value: ${{ steps.detect.outputs.changed }}
  reason:
    description: "One line saying why, such as 'since a1b2c3d4e5f6'"
    value: ${{ steps.detect.outputs.reason }}
  base:
    description: "The base commit compared against; empty when unresolved"
    value: ${{ steps.detect.outputs.base }}
  manifest:
    description: "Path to the sidecar; empty when unresolved"
    value: ${{ steps.detect.outputs.manifest }}

runs:
  using: "composite"
  steps:
    - name: "Detect dependency changes"
      id: detect
      shell: bash
      env:
        INPUT_ECOSYSTEMS: ${{ inputs.ecosystems }}
        INPUT_PATTERNS: ${{ inputs.patterns }}
        INPUT_PATH_PREFIX: ${{ inputs.path-prefix }}
        INPUT_GERRIT_REFSPEC: ${{ inputs.gerrit-refspec }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_OUTPUT: ${{ inputs.output }}
        EVENT_BEFORE: ${{ github.event.before }}
      run: |
        # Detect dependency changes
        bash "$GITHUB_ACTION_PATH/scripts/dependency-change.sh"
