# dependency-change-action
name: "📦 Dependency Change"
description: >-
  Detect whether a change touched dependency files, reading git objects
  only
# Reads git diff and git ls-tree between a base commit and HEAD; never
# the working tree. Fails closed: when it cannot prove what changed, the
# 'changed' output is empty and no sidecar is written.

inputs:
  ecosystems:
    description: >-
      Comma-separated presets: node, python, go, maven, gradle, rust, docker
    required: false
    default: ""
  patterns:
    description: "Extra patterns, one per line, added to the presets"
    required: false
    default: ""
  path-prefix:
    description: "Project directory within the repository"
    required: false
    default: "."
  gerrit-refspec:
    description: >-
      Set on Gerrit-triggered runs; the checkout is then the change itself
    required: false
    default: ""
  base:
    description: "Explicit base commit, overriding event detection"
    required: false
    default: ""
  output:
    description: "Sidecar path, written only when the result is resolved"
    required: false
    default: "dependency-change.json"
  git:
    description: >-
      Absolute path of the git executable; empty finds git on PATH
    required: false
    default: ""

outputs:
  changed:
    description: "true, false, or empty when unresolved"
    value: ${{ steps.detect.outputs.changed }}
  reason:
    description: "One line saying why"
    value: ${{ steps.detect.outputs.reason }}
  base:
    description: "The base commit compared against; empty when unresolved"
    value: ${{ steps.detect.outputs.base }}
  manifest:
    description: "Path to the sidecar; empty when unresolved"
    value: ${{ steps.detect.outputs.manifest }}

runs:
  using: "composite"
  steps:
    - name: "Detect dependency changes"
      id: detect
      shell: bash
      env:
        INPUT_ECOSYSTEMS: ${{ inputs.ecosystems }}
        INPUT_PATTERNS: ${{ inputs.patterns }}
        INPUT_PATH_PREFIX: ${{ inputs.path-prefix }}
        INPUT_GERRIT_REFSPEC: ${{ inputs.gerrit-refspec }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_GIT: ${{ inputs.git }}
        EVENT_BEFORE: ${{ github.event.before }}
      run: |
        # Detect dependency changes
        # -I keeps the checkout, PYTHONPATH and the user site off
        # sys.path; the entry point adds the action's own scripts
        # directory, so nothing in the change under review is imported.
        python3 -I "${GITHUB_ACTION_PATH}/scripts/dependency_change/__main__.py"
